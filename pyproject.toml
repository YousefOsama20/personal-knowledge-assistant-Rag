[project]
name = "personal-knowledge-assistant-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yousef Osama", email = "yousefosama7620@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pypdf>=4.3.1",
    "python-docx>=1.1.3",
    "chromadb>=0.6.2.post1",
    "sentence-transformers>=4.1.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.13.4",
    "google-genai>=2.22.0",
]

[project.scripts]
personal-knowledge-assistant-rag = "personal_knowledge_assistant_rag:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
